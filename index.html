<body>


    <!-- ========================================

    <header>

        <nav>

            <!-- Brand -->

            </div>

        </nav>

    </header>


    <!-- ========================================

    ======================================== -->

    <main>


        <!-- ========================================

        ======================================== -->

        <section>


            <!-- DPS POET CARD -->

            <article id="dps-poet-card">

                <!-- DPS data will appear here -->

            </article>


            <!-- ENTER DPS PROFILE -->

            <a href="./pages/poet-detail.html?id=poet-013">

                ENTER MY PROFILE

            </a>


        </section>


        <!-- ========================================

        ======================================== -->

        <section>

            <h2>

            </h2>


            <p>

                [ "POETRY is higest form of languase , something let us to form us humanity.
                lets recite poetry."]

            </p>

        </section>

    <!-- ========================================

    <footer>


        <!-- Brand -->

        <p>
            DPSRY

        <!-- Footer Navigation -->

        <nav>

            <a href="./index.html">

        </p>

    <!-- ========================================
         LOAD DPSRY DATA
    ======================================== -->

    <script src="./js/data.js"></script>


    <!-- ========================================
         HOME PAGE LOGIC
    ======================================== -->

    <script>


        // Wait until DPSRY data has loaded

        loadDPSRYData().then(() => {


            // ========================================
            // FIND DPS
            // ========================================

            const dps = DPSRY_DATA.poets.find(

                poet => poet.id === "poet-013"

            );


            // Stop if DPS cannot be found

            if (!dps) {

                console.error(
                    "DPS was not found."
                );

                return;

            }


            // ========================================
            // FIND DPS POET CARD
            // ========================================

            const dpsPoetCard =
                document.getElementById(
                    "dps-poet-card"
                );


            // ========================================
            // DISPLAY DPS
            // ========================================

            dpsPoetCard.innerHTML = `

                <div>

                    <p>
                        DPS POET
                    </p>


                    <h1>
                        ${dps.name}
                    </h1>


                    <p>
                        ${dps.introduction}
                    </p>


                </div>

            `;


        });


    </script>


</body>
