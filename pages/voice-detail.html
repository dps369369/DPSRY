<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voice | DPSRY</title>
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/typography.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>

<body>


    <!-- ========================================
         HEADER
    ======================================== -->

    <header>

        <nav>

            <!-- Brand -->

            <a href="../index.html">
                DPSRY
            </a>


            <!-- Navigation -->

            <div>

                <a href="../index.html">
                    HOME
                </a>

                <a href="./poets.html">
                    POET
                </a>

                <a href="./poetry.html">
                    POETRY
                </a>

                <a href="./voices.html">
                    VOICE
                </a>

                <a href="./about.html">
                    ABOUT
                </a>

            </div>

        </nav>

    </header>


    <!-- ========================================
         MAIN
    ======================================== -->

    <main>


        <!-- ========================================
             VOICE INFORMATION
        ======================================== -->

        <h1 id="voice-name"></h1>

        <p id="voice-rank"></p>

        <p id="voice-poetry-count"></p>

        <p id="voice-description"></p>


        <!-- ========================================
             VOICE'S POETRY
        ======================================== -->

        <h2>Poetry</h2>

        <div id="voice-poetry-list"></div>


    </main>


    <!-- ========================================
         FOOTER
    ======================================== -->

    <footer>

        <!-- Brand -->

        <p>
            DPSRY
        </p>


        <!-- Navigation -->

        <nav>

            <a href="../index.html">
                HOME
            </a>

            <a href="./poets.html">
                POET
            </a>

            <a href="./poetry.html">
                POETRY
            </a>

            <a href="./voices.html">
                VOICE
            </a>

            <a href="./about.html">
                ABOUT
            </a>

        </nav>


        <!-- Copyright -->

        <p>
            © DPSRY
        </p>

    </footer>


    <!-- ========================================
         LOAD DPSRY DATA
    ======================================== -->

    <script src="../js/data.js"></script>

    <!-- Load DPSRY ranking functions -->

    <script src="../js/ranking.js"></script>


    <script>

        // Wait until all DPSRY data has loaded
        loadDPSRYData().then(() => {


            // ========================================
            // GET VOICE ID FROM URL
            // ========================================

            const urlParams = new URLSearchParams(
                window.location.search
            );

            const voiceId = urlParams.get("id");


            // ========================================
            // FIND VOICE
            // ========================================

            const voice = DPSRY_DATA.voices.find(
                voice => voice.id === voiceId
            );


            // Stop if Voice does not exist

            if (!voice) {

                document.body.innerHTML = `
                    <h1>Voice not found</h1>
                `;

                return;

            }


            // ========================================
            // VOICE STATISTICS
            // ========================================

            const voiceStatistics = getVoiceStatistics(
                DPSRY_DATA.voices,
                DPSRY_DATA.poetry
            );


            // ========================================
            // VOICE RANKING
            // ========================================

            const rankedVoices = getRankedVoices(
                voiceStatistics
            );


            // Find this Voice's ranking information

            const rankedVoice = rankedVoices.find(
                rankedVoice => rankedVoice.id === voiceId
            );


            // ========================================
            // DISPLAY VOICE INFORMATION
            // ========================================

            document.getElementById(
                "voice-name"
            ).textContent = voice.name;


            document.getElementById(
                "voice-rank"
            ).textContent =
                `Rank: #${rankedVoice.rank}`;


            document.getElementById(
                "voice-poetry-count"
            ).textContent =
                `Poetry: ${rankedVoice.poetryCount}`;


            document.getElementById(
                "voice-description"
            ).textContent =
                voice.description;


            // ========================================
            // GLOBAL POETRY RANKING
            // ========================================

            const rankedPoetry = getRankedPoetry(
                DPSRY_DATA.poetry
            );


            // ========================================
            // FIND THIS VOICE'S POETRY
            // ========================================

            const voicePoetry = rankedPoetry.filter(
                poem => poem.voice === voiceId
            );


            // ========================================
            // POETRY CONTAINER
            // ========================================

            const poetryList = document.getElementById(
                "voice-poetry-list"
            );


            // ========================================
            // DISPLAY VOICE'S POETRY
            // ========================================

            voicePoetry.forEach(poem => {


                // Find the Poet who wrote this Poetry

                const poet = DPSRY_DATA.poets.find(
                    poet => poet.id === poem.poet
                );


                // Display Poetry

                poetryList.innerHTML += `

                    <article class="poetry-card">

                        <h3>

                            <a href="./poetry-detail.html?id=${poem.id}">
                                #${poem.rank} — ${poem.name}
                            </a>

                        </h3>

                        <p>
                            ${poem.rating} |
                            ${poet ? poet.name : "Unknown Poet"}
                        </p>

                    </article>

                `;

            });

        });

    </script>

</body>

</html>
