    <script src="../js/data.js"></script>

    <!-- Load ranking functions -->

    <!-- Load Voice rendering functions -->
    <script src="../js/voice.js"></script>


    <script>

        // Wait until DPSRY data has loaded
        loadDPSRYData().then(() => {

            // Calculate Voice statistics
            const voiceStatistics = getVoiceStatistics(
                DPSRY_DATA.voices,
                DPSRY_DATA.poetry
            );


            // Rank Voices by Poetry count
            const rankedVoices = getRankedVoices(
                voiceStatistics
            );


            // Check the result
            console.log(
                "Ranked Voices:",
                rankedVoices
            );


            // Display Voices
            renderVoices(rankedVoices);

        });

    </script>
